<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #fff; font-family: 'Poppins', Arial, sans-serif; }
    .card { width: 1200px; height: 630px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .logo { position: relative; display: inline-block; padding-bottom: .34em; font-size: 140px; line-height: 1; }
    .name { display: block; font-weight: 700; letter-spacing: -.055em; }
    .tagline { position: absolute; right: 0; bottom: 0; left: 0; display: flex; justify-content: space-between; font-size: .16em; font-weight: 400; }
    .statement { margin: 58px 0 18px; color: #fffcaf; font-size: 32px; font-weight: 500; letter-spacing: -.025em; }
    .services { margin: 0; color: #ccc; font-size: 20px; }
    .url { position: absolute; bottom: 36px; color: #ff3cb4; font-size: 20px; letter-spacing: .08em; }
    .rule { position: absolute; left: 70px; right: 70px; height: 2px; top: 45px; background: #ff3cb4; }
  </style>
</head>
<body>
  <div class="card">
    <div class="rule"></div>
    <div class="logo"><span class="name">DeVision</span><span class="tagline"><span>M</span><span>A</span><span>R</span><span>K</span><span>E</span><span>T</span><span>I</span><span>N</span><span>G</span><span>&nbsp;</span><span>A</span><span>G</span><span>E</span><span>N</span><span>C</span><span>Y</span></span></div>
    <p class="statement">Strategija. Kreativnost. Rezultati.</p>
    <p class="services">Sadržaj · Digitalni marketing · Brending · Web · Eventi</p>
    <span class="url">devision.hr</span>
  </div>
</body>
</html>
